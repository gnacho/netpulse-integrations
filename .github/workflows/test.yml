name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vendor catalog
        run: python3 .github/validate_vendors.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Build all commands
        env:
          CGO_ENABLED: 0
        run: go build ./...
      - name: Build static pushers
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          GOARCH=amd64 go build -trimpath -o /tmp/routeros-pusher ./routeros/cmd/routeros-pusher
          GOARCH=arm64 go build -trimpath -o /tmp/asuswrt-pusher ./asuswrt/cmd/asuswrt-pusher
          GOARCH=amd64 go build -trimpath -o /tmp/unifi-pusher ./unifi/cmd/unifi-pusher
