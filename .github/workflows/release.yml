name: release

on:
  push:
    tags:
      - 'routeros/v*'
      - 'asuswrt/v*'
      - 'bbox/v*'
      - 'fn/v*'
      - 'unifi/v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve integration
        id: integration
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            routeros/v*)
              name=routeros
              binary=routeros-pusher
              target=./routeros/cmd/routeros-pusher
              ldvar=main.Version
              arches=amd64
              ;;
            asuswrt/v*)
              name=asuswrt
              binary=asuswrt-pusher
              target=./asuswrt/cmd/asuswrt-pusher
              ldvar=main.Version
              arches=arm64
              ;;
            bbox/v*)
              name=integrations-supervisor
              binary=netpulse-integrations
              target=./cmd/integrations-supervisor
              ldvar=main.version
              arches="amd64 arm64"
              ;;
            fn/v*)
              name=fn
              binary=fn-pusher
              target=./fn/cmd/fn-pusher
              ldvar=main.Version
              arches="amd64 arm64"
              ;;
            unifi/v*)
              name=unifi
              binary=unifi-pusher
              target=./unifi/cmd/unifi-pusher
              ldvar=main.Version
              arches=amd64
              ;;
            *)
              echo "Unsupported tag: $TAG" >&2
              exit 1
              ;;
          esac
          version=${TAG#*/v}
          if [ -z "$version" ]; then
            echo "Empty version in tag: $TAG" >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "binary=$binary"
            echo "target=$target"
            echo "ldvar=$ldvar"
            echo "arches=$arches"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Build static binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          BINARY: ${{ steps.integration.outputs.binary }}
          TARGET: ${{ steps.integration.outputs.target }}
          LDVAR: ${{ steps.integration.outputs.ldvar }}
          ARCHES: ${{ steps.integration.outputs.arches }}
          VERSION: ${{ steps.integration.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for arch in $ARCHES; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w -X $LDVAR=$VERSION" \
              -o "dist/$BINARY-$arch" "$TARGET"
            if ! grep -aqF "$VERSION" "dist/$BINARY-$arch"; then
              echo "version $VERSION is not embedded in $BINARY-$arch" >&2
              exit 1
            fi
          done
      - name: Package release
        env:
          NAME: ${{ steps.integration.outputs.name }}
          BINARY: ${{ steps.integration.outputs.binary }}
          ARCHES: ${{ steps.integration.outputs.arches }}
          VERSION: ${{ steps.integration.outputs.version }}
        run: |
          set -eu
          mkdir -p stage
          for arch in $ARCHES; do
            cp "dist/$BINARY-$arch" "stage/$BINARY"
            asset="${NAME}_${VERSION}_linux_${arch}.tar.gz"
            tar -czf "dist/$asset" -C stage "$BINARY"
            rm -f "stage/$BINARY"
            ( cd dist && sha256sum "$asset" > "$asset.sha256" )
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.integration.outputs.name }}
          ARCHES: ${{ steps.integration.outputs.arches }}
          VERSION: ${{ steps.integration.outputs.version }}
        run: |
          set -eu
          assets=()
          for arch in $ARCHES; do
            asset="dist/${NAME}_${VERSION}_linux_${arch}.tar.gz"
            assets+=("$asset" "$asset.sha256")
          done
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" --generate-notes
